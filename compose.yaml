name: ticketops

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
  APP_URL: ${APP_URL:?Set APP_URL in .env}
  PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
  PAYOS_API_KEY: ${PAYOS_API_KEY:-}
  PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticketops
      POSTGRES_USER: ticketops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  web:
    image: ticketops-web:local
    build:
      context: ./web
      target: web-runner
    restart: unless-stopped
    environment:
      <<: *app-environment
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - edge
      - backend
      - egress

  worker:
    image: ticketops-ops:local
    build:
      context: ./web
      target: ops-runner
    command: ["npm", "run", "worker"]
    restart: unless-stopped
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - egress

  migrate:
    image: ticketops-ops:local
    build:
      context: ./web
      target: ops-runner
    command: ["npm", "run", "db:migrate"]
    restart: "no"
    profiles: ["tools"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - edge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  egress:
  backend:
    internal: true
